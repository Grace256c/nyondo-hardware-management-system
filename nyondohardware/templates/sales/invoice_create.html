{% extends 'base.html' %}

{% block title %}New Sale{% endblock %}

{% block content %}

<div class="mb-6">
    <h1 class="text-2xl font-bold" style="color: #0a1f44;">New Sale</h1>
    <p class="text-sm text-gray-500 mt-1">
        <a href="{% url 'sales:invoice-list' %}" class="hover:underline" style="color: #f97316;">
            Invoices
        </a>
        &rsaquo; New Sale
    </p>
</div>

<form method="POST">
    {% csrf_token %}

    <div class="grid grid-cols-3 gap-6">

        <!-- LEFT: CUSTOMER + PAYMENT -->
        <div class="col-span-1 space-y-4">

            <!-- CUSTOMER CARD -->
            <div class="bg-white rounded shadow-sm border border-gray-200">
                <div class="px-6 py-4 border-b border-gray-100">
                    <h2 class="text-sm font-semibold text-gray-700">Customer</h2>
                </div>
                <div class="px-6 py-4 space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Select Customer
                        </label>
                        <select name="customer" id="customer-select"
                                style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:8px 12px; font-size:14px; background:white;">
                            <option value="">-- Walk-in / No customer --</option>
                            {% for customer in customers %}
                            <option value="{{ customer.pk }}"
                                    data-type="{{ customer.customer_type }}"
                                    data-distance="{{ customer.distance_km }}">
                                {{ customer.name }} ({{ customer.get_customer_type_display }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Or enter name (walk-in)
                        </label>
                        <input type="text" name="customer_name"
                               placeholder="Walk-in customer name"
                               style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:8px 12px; font-size:14px;">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Customer Type <span class="text-red-500">*</span>
                        </label>
                        <select name="customer_type"
                                style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:8px 12px; font-size:14px; background:white;">
                            <option value="retail">Retail</option>
                            <option value="wholesale">Wholesale</option>
                            <option value="walk_in">Walk In</option>
                        </select>
                    </div>

                </div>
            </div>

            <!-- PAYMENT CARD -->
            <div class="bg-white rounded shadow-sm border border-gray-200">
                <div class="px-6 py-4 border-b border-gray-100">
                    <h2 class="text-sm font-semibold text-gray-700">Payment</h2>
                </div>
                <div class="px-6 py-4 space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Payment Method <span class="text-red-500">*</span>
                        </label>
                        <select name="payment_method"
                                style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:8px 12px; font-size:14px; background:white;">
                            <option value="cash">Cash</option>
                            <option value="mobile_money">Mobile Money</option>
                            <option value="bank_transfer">Bank Transfer</option>
                            <option value="cheque">Cheque</option>
                            <option value="scheme">Scheme</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Payment Status <span class="text-red-500">*</span>
                        </label>
                        <select name="payment_status"
                                style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:8px 12px; font-size:14px; background:white;">
                            <option value="paid">Paid</option>
                            <option value="credit">Credit</option>
                            <option value="partial">Partial</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Amount Paid (UGX)
                        </label>
                        <input type="number" name="amount_paid" value="0"
                               style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:8px 12px; font-size:14px;">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Notes
                        </label>
                        <textarea name="notes" rows="2"
                                  style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:8px 12px; font-size:14px;"></textarea>
                    </div>

                </div>
            </div>
        </div>

        <!-- RIGHT: PRODUCTS -->
        <div class="col-span-2">
            <div class="bg-white rounded shadow-sm border border-gray-200">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h2 class="text-sm font-semibold text-gray-700">Products</h2>
                    <button type="button" onclick="addRow()"
                            class="px-3 py-1.5 text-xs font-medium text-white rounded"
                            style="background-color: #f97316;">
                        + Add Row
                    </button>
                </div>
                <div class="px-6 py-4">
                    <table class="w-full text-sm" id="items-table">
                        <thead>
                            <tr class="text-left text-gray-500 border-b border-gray-100">
                                <th class="pb-2 font-medium">Product</th>
                                <th class="pb-2 font-medium">Qty</th>
                                <th class="pb-2 font-medium">Unit Price</th>
                                <th class="pb-2 font-medium">Total</th>
                                <th class="pb-2"></th>
                            </tr>
                        </thead>
                        <tbody id="items-body">
                            <tr class="item-row">
                                <td class="py-2 pr-2">
                                    <select name="product"
                                            style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:6px 8px; font-size:13px; background:white;">
                                        <option value="">-- Select Product --</option>
                                        {% for product in products %}
                                        <option value="{{ product.pk }}"
                                                data-retail="{{ product.retail_price }}"
                                                data-wholesale="{{ product.wholesale_price }}"
                                                data-stock="{{ product.quantity }}">
                                            {{ product.name }} (Stock: {{ product.quantity }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td class="py-2 pr-2">
                                    <input type="number" name="quantity" value="1" min="1"
                                           style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:6px 8px; font-size:13px;">
                                </td>
                                <td class="py-2 pr-2">
                                    <input type="number" name="unit_price" value="0"
                                           style="width:100%; border:1px solid #d1d5db; border-radius:4px; padding:6px 8px; font-size:13px;">
                                </td>
                                <td class="py-2 pr-2 row-total text-gray-700">UGX 0</td>
                                <td class="py-2">
                                    <button type="button" onclick="removeRow(this)"
                                            class="text-red-400 hover:text-red-600 text-xs">✕</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- TOTALS -->
                    <div class="mt-4 border-t border-gray-100 pt-4 space-y-2 text-sm">
                        <div class="flex justify-between text-gray-600">
                            <span>Subtotal</span>
                            <span id="subtotal">UGX 0</span>
                        </div>
                        <div class="flex justify-between text-gray-600">
                            <span>Transport</span>
                            <span id="transport">UGX 0</span>
                        </div>
                        <div class="flex justify-between font-bold text-base border-t border-gray-200 pt-2" style="color: #0a1f44;">
                            <span>Total</span>
                            <span id="grand-total">UGX 0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SUBMIT -->
            <div class="mt-4 flex gap-3">
                <button type="submit"
                        class="px-6 py-2 text-sm font-medium text-white rounded transition"
                        style="background-color: #f97316;">
                    Save Invoice
                </button>
                <a href="{% url 'sales:invoice-list' %}"
                   class="px-6 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded hover:bg-gray-200 transition">
                    Cancel
                </a>
            </div>
        </div>
    </div>
</form>

<script>
function addRow() {
    var tbody = document.getElementById('items-body');
    var firstRow = tbody.querySelector('.item-row');
    var newRow = firstRow.cloneNode(true);
    newRow.querySelectorAll('input').forEach(function(input) {
        if (input.name === 'quantity') input.value = 1;
        if (input.name === 'unit_price') input.value = 0;
    });
    newRow.querySelector('select').selectedIndex = 0;
    newRow.querySelector('.row-total').textContent = 'UGX 0';
    tbody.appendChild(newRow);
}

function removeRow(btn) {
    var tbody = document.getElementById('items-body');
    if (tbody.querySelectorAll('.item-row').length > 1) {
        btn.closest('.item-row').remove();
        updateTotals();
    }
}

function updateTotals() {
    var rows = document.querySelectorAll('.item-row');
    var subtotal = 0;
    rows.forEach(function(row) {
        var qty = parseFloat(row.querySelector('[name="quantity"]').value) || 0;
        var price = parseFloat(row.querySelector('[name="unit_price"]').value) || 0;
        var total = qty * price;
        row.querySelector('.row-total').textContent = 'UGX ' + total.toLocaleString();
        subtotal += total;
    });
    document.getElementById('subtotal').textContent = 'UGX ' + subtotal.toLocaleString();
    document.getElementById('grand-total').textContent = 'UGX ' + subtotal.toLocaleString();
}

document.addEventListener('input', function(e) {
    if (e.target.name === 'quantity' || e.target.name === 'unit_price') {
        updateTotals();
    }
});
</script>

{% endblock %}
