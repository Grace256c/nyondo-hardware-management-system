{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Nyondo Hardware</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    style="background-color: #0a1f44"
    class="min-h-screen flex items-center justify-center"
  >
    <div class="w-full max-w-md">
      <!-- LOGO CARD -->
      <div class="text-center mb-8">
        <div class="flex items-center justify-center mx-auto mb-4">
          <img
            src="{% static 'images/logo.png' %}"
            alt="Logo"
            class="w-40 md:w-48 h-auto object-contain"
          />
        <!-- <h1 class="text-gray-400 text-sm mt-1">Sign in to your account</h1> -->
      </div>
      </div>

      <!-- LOGIN FORM -->
      <div class="bg-white rounded-xl shadow-lg px-8 py-8">
        {% if messages %} {% for message in messages %}
        <div
          class="mb-4 px-4 py-3 rounded text-sm font-medium {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200 {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}"
        >
          {{ message }}
        </div>
        {% endfor %} {% endif %}

        <form method="POST" class="space-y-5">
          {% csrf_token %}

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Username
            </label>
            <input
              type="text"
              name="username"
              required
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-orange-400"
              placeholder="Enter your username"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Password
            </label>
            <input
              type="password"
              name="password"
              required
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-orange-400"
              placeholder="Enter your password"
            />
          </div>

          <button
            type="submit"
            class="w-full py-2 text-sm font-medium text-white rounded transition"
            style="background-color: #f97316"
          >
            Sign In
          </button>
        </form>
      </div>

      <p class="text-center text-gray-500 text-xs mt-6">
        &copy; 2026 Nyondo Hardware LTD — Nansana, Uganda
      </p>
    </div>
  </body>
</html>
